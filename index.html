<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الجامعة</title>
    
    <!-- ملفات CSS المنفصلة -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/headers.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/info.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/popups.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- الحاوية الرئيسية -->
    <div id="app">
        <!-- صفحة تسجيل الدخول -->
<div id="login-page" class="page login-page active">
            <div class="login-card">
                <h2 class="login-title">تسجيل الدخول</h2>
                <form id="login-form">
                    <input type="email" name="email" placeholder="البريد الجامعي" required class="form-input">
                    <input type="password" name="password" placeholder="كلمة المرور" required class="form-input">
                    <button type="submit" class="btn-login">دخول</button>
                </form>
            </div>
        </div>

        <!-- باقي الصفحات سيتم إضافتها بواسطة JavaScript -->
    </div>

    <!-- ملفات JavaScript المنفصلة -->
    <script src="js/rooms.js"></script>
    <script src="js/info.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/pathfinding.js"></script>
    <script src="js/state.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/map.js"></script>
    <script src="js/search.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/schedulepop.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
